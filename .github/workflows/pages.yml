name: pages

on:
  push:
    branches: [main]
    paths: ["index.html", "demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/demo
          cp index.html _site/
          cp -r demo/index.html demo/data demo/preview.png _site/demo/
          touch _site/.nojekyll
          find _site -type f | sort

      # One-time setup: Pages must be enabled for this repository with "GitHub Actions"
      # as the source (Settings -> Pages). The workflow token cannot turn it on itself,
      # because creating a Pages site needs repository admin rights.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
