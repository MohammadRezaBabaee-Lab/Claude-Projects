name: ci

on:
  push:
    paths: ["trading-agent/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["trading-agent/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check trading_agent tests scripts migrations

      - name: Tests
        run: pytest -q

      - name: Configuration must fail closed on a bad value
        run: |
          if MAX_PORTFOLIO_EXPOSURE=5 trading-agent --env-file /dev/null validate-config; then
            echo "::error::invalid configuration was accepted; the fail-closed guarantee is broken"
            exit 1
          fi
          echo "invalid configuration correctly rejected"

      - name: Live trading must stay disabled by default
        run: |
          trading-agent --env-file /dev/null validate-config | tee /tmp/cfg.txt
          grep -q "live_orders_permitted=False" /tmp/cfg.txt \
            || { echo "::error::default configuration permits live orders"; exit 1; }

      - name: Dependency audit
        run: pip-audit --skip-editable --progress-spinner off || true
