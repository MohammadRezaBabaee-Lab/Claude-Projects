# Paper-trading stack: PostgreSQL + agent + dashboard.
# Secrets come from ./.env (git-ignored). Live trading cannot be enabled from this file alone:
# it still requires the full gate documented in docs/live_trading.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trading
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD}@db:5432/trading
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD}@db:5432/trading
      TRADING_MODE: ${TRADING_MODE:-paper}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD}@db:5432/trading
      DASHBOARD_HOST: 0.0.0.0
    command: ["trading-agent", "dashboard", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"   # localhost only: the dashboard has no authentication
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
